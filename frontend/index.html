<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weather-Advisory Support Bot — outdoor activity safety powered by live weather data">
    <title>Weather Advisory Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           RESET & BASE
           ================================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e8e8f0;
        }

        /* ================================================================
           STEP 1 — STAR FIELD  (z -1)
           ================================================================ */
        #stars {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(1.2px 1.2px at  5%  8%, rgba(255,255,255,.85), transparent),
                radial-gradient(1.0px 1.0px at 12% 45%, rgba(255,255,255,.70), transparent),
                radial-gradient(1.5px 1.5px at 18% 92%, rgba(200,210,255,.80), transparent),
                radial-gradient(0.8px 0.8px at 25% 30%, rgba(255,255,255,.55), transparent),
                radial-gradient(1.3px 1.3px at 32% 72%, rgba(255,255,255,.75), transparent),
                radial-gradient(1.0px 1.0px at 40% 15%, rgba(220,220,255,.65), transparent),
                radial-gradient(1.4px 1.4px at 47% 58%, rgba(255,255,255,.80), transparent),
                radial-gradient(0.9px 0.9px at 55% 85%, rgba(255,255,255,.60), transparent),
                radial-gradient(1.1px 1.1px at 60% 38%, rgba(200,200,255,.70), transparent),
                radial-gradient(1.6px 1.6px at 68% 10%, rgba(255,255,255,.90), transparent),
                radial-gradient(0.7px 0.7px at 75% 65%, rgba(255,255,255,.50), transparent),
                radial-gradient(1.2px 1.2px at 82% 22%, rgba(230,230,255,.75), transparent),
                radial-gradient(1.0px 1.0px at 88% 78%, rgba(255,255,255,.65), transparent),
                radial-gradient(1.5px 1.5px at 92% 50%, rgba(255,255,255,.85), transparent),
                radial-gradient(0.8px 0.8px at 95% 95%, rgba(255,255,255,.55), transparent),
                radial-gradient(1.1px 1.1px at  3% 60%, rgba(200,220,255,.70), transparent),
                radial-gradient(1.3px 1.3px at 15% 18%, rgba(255,255,255,.60), transparent),
                radial-gradient(0.9px 0.9px at 28% 52%, rgba(255,255,255,.50), transparent),
                radial-gradient(1.0px 1.0px at 37% 88%, rgba(220,220,255,.65), transparent),
                radial-gradient(1.4px 1.4px at 50% 25%, rgba(255,255,255,.80), transparent),
                radial-gradient(0.8px 0.8px at 58% 42%, rgba(255,255,255,.45), transparent),
                radial-gradient(1.2px 1.2px at 65% 95%, rgba(200,210,255,.70), transparent),
                radial-gradient(1.6px 1.6px at 72% 35%, rgba(255,255,255,.90), transparent),
                radial-gradient(1.0px 1.0px at 78% 55%, rgba(255,255,255,.55), transparent),
                radial-gradient(0.9px 0.9px at 85% 8%,  rgba(220,230,255,.65), transparent),
                radial-gradient(1.3px 1.3px at 90% 68%, rgba(255,255,255,.75), transparent),
                radial-gradient(1.1px 1.1px at  8% 75%, rgba(255,255,255,.60), transparent),
                radial-gradient(1.5px 1.5px at 22% 5%,  rgba(200,200,255,.85), transparent),
                radial-gradient(0.7px 0.7px at 45% 70%, rgba(255,255,255,.45), transparent),
                radial-gradient(1.0px 1.0px at 52% 12%, rgba(255,255,255,.65), transparent);
            background-color: #050510;
        }

        /* ================================================================
           STEP 1 — THREE.JS CANVAS  (z 0)
           ================================================================ */
        #earth-canvas {
            position: fixed; inset: 0; z-index: 0;
        }

        /* ================================================================
           STEP 3 — WEATHER OVERLAYS  (z 5)
           ================================================================ */
        #weather-overlay {
            position: fixed; inset: 0; z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #weather-overlay.active { opacity: 1; }

        /* -- Sunny -- */
        #weather-overlay.sunny {
            background: radial-gradient(ellipse at 15% 10%,
                rgba(255, 200, 50, 0.25) 0%,
                rgba(255, 170, 30, 0.08) 40%,
                transparent 70%);
        }

        /* -- Cloudy -- */
        #weather-overlay.cloudy { overflow: hidden; }
        .cloud {
            position: absolute;
            background: rgba(200, 210, 220, 0.18);
            border-radius: 50%;
            filter: blur(40px);
        }
        .cloud:nth-child(1) { width: 350px; height: 120px; top: 8%;  left: -350px; animation: drift 28s linear infinite; }
        .cloud:nth-child(2) { width: 280px; height: 100px; top: 25%; left: -280px; animation: drift 35s linear infinite 4s; }
        .cloud:nth-child(3) { width: 400px; height: 140px; top: 50%; left: -400px; animation: drift 32s linear infinite 8s; }
        .cloud:nth-child(4) { width: 250px; height:  90px; top: 70%; left: -250px; animation: drift 38s linear infinite 12s; }
        .cloud:nth-child(5) { width: 320px; height: 110px; top: 40%; left: -320px; animation: drift 30s linear infinite 16s; }

        @keyframes drift {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(100vw + 450px)); }
        }

        /* -- Rain -- */
        #weather-overlay.rain { overflow: hidden; }
        #weather-overlay.rain::before {
            content: '';
            position: absolute; inset: 0;
            background: rgba(30, 60, 100, 0.15);
        }
        #rain-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* -- Thunderstorm -- */
        #weather-overlay.thunderstorm { overflow: hidden; }
        #weather-overlay.thunderstorm::before {
            content: '';
            position: absolute; inset: 0;
            background: rgba(15, 25, 50, 0.25);
        }
        #lightning-flash {
            position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0);
            pointer-events: none;
            animation: flash 6s ease infinite;
        }
        @keyframes flash {
            0%, 92%, 100% { background: rgba(255,255,255,0); }
            93%           { background: rgba(255,255,255,0.5); }
            94%           { background: rgba(255,255,255,0.05); }
            96%           { background: rgba(255,255,255,0.35); }
            97%           { background: rgba(255,255,255,0); }
        }

        /* ================================================================
           STEP 2 — CHAT UI  (z 10)
           ================================================================ */
        #chat-layer {
            position: fixed; inset: 0; z-index: 10;
            display: flex; justify-content: flex-end;
            padding: 16px;
            pointer-events: none;
        }

        /* ================================================================
           HERO TITLE (Left Side)
           ================================================================ */
        #hero-title {
            position: absolute;
            left: 6%;
            top: 50%;
            transform: translateY(-50%);
            width: 380px;
            padding: 40px;
            background: rgba(15, 15, 30, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            text-align: left;
            opacity: 0;
            animation: fade-in-hero 1.5s ease 0.5s forwards;
        }

        @keyframes fade-in-hero {
            from { opacity: 0; transform: translateY(-40%); }
            to { opacity: 1; transform: translateY(-50%); }
        }

        #hero-title .hero-icon {
            font-size: 56px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        }

        #hero-title h1 {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 16px 0;
            text-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        #hero-title p {
            color: #b4b4cb;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            font-weight: 400;
        }

        @media (max-width: 1100px) {
            #hero-title { display: none; }
        }

        .chat-panel {
            width: 420px; max-width: 100%;
            height: 100%;
            display: flex; flex-direction: column;
            background: rgba(12, 12, 22, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 18px;
            box-shadow:
                0 0 30px rgba(99, 102, 241, 0.08),
                0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            overflow: hidden;
        }

        /* -- Header -- */
        .chat-header {
            padding: 14px 18px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        .chat-header::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            border-radius: 18px 18px 0 0;
        }
        .chat-header-left {
            display: flex; align-items: center; gap: 10px;
        }
        .chat-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            box-shadow: 0 2px 10px rgba(99,102,241,0.3);
        }
        .chat-title {
            font-size: 14px; font-weight: 600; letter-spacing: -0.3px;
        }
        .chat-title span {
            color: #6a6a82; font-weight: 400; font-size: 11px; margin-left: 6px;
        }
        .btn-new {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 7px;
            color: #a0a0b8; font-size: 11px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-new:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(99,102,241,0.4);
            color: #e8e8f0;
        }

        /* -- Messages -- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* Welcome */
        .welcome {
            text-align: center; padding: 30px 12px; color: #6a6a82;
        }
        .welcome-icon {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin: 0 auto 14px;
            box-shadow: 0 6px 20px rgba(99,102,241,0.3);
        }
        .welcome h2 { font-size: 16px; font-weight: 600; color: #e8e8f0; margin-bottom: 6px; }
        .welcome p  { font-size: 12px; line-height: 1.6; max-width: 320px; margin: 0 auto; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
        .suggestion {
            padding: 6px 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            font-size: 11px; color: #a0a0b8;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .suggestion:hover {
            background: rgba(99,102,241,0.1);
            border-color: rgba(99,102,241,0.3);
            color: #818cf8;
        }

        /* Message bubbles */
        .msg {
            display: flex; gap: 10px; max-width: 100%;
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0; margin-top: 2px;
        }
        .msg.bot .msg-avatar {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            box-shadow: 0 2px 6px rgba(99,102,241,0.25);
        }
        .msg.user .msg-avatar { background: rgba(255,255,255,0.08); }
        .msg-body {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px; line-height: 1.6;
            min-width: 0;
        }
        .msg.user .msg-body {
            background: rgba(99,102,241,0.35);
            border-color: rgba(99,102,241,0.25);
        }
        .msg-body p { margin-bottom: 6px; }
        .msg-body p:last-child { margin-bottom: 0; }

        /* Error bubble */
        .msg-body.error {
            background: rgba(248,113,113,0.12);
            border-color: rgba(248,113,113,0.25);
            color: #fca5a5;
        }

        /* Citation */
        .citation {
            margin-top: 8px; padding: 8px 10px;
            background: rgba(255,255,255,0.03);
            border-left: 2px solid #6366f1;
            border-radius: 0 6px 6px 0;
            font-size: 10px; color: #6a6a82; line-height: 1.5;
        }

        /* "Why this answer" panel */
        .trace-toggle {
            margin-top: 6px;
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 5px;
            font-size: 10px; color: #6a6a82;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .trace-toggle:hover {
            border-color: rgba(99,102,241,0.4);
            color: #818cf8;
        }
        .trace-panel {
            display: none;
            margin-top: 6px; padding: 10px;
            background: rgba(5,5,16,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            color: #a0a0b8;
            line-height: 1.5;
            max-height: 240px;
            overflow-y: auto;
        }
        .trace-panel.open { display: block; }
        .trace-panel .trace-section {
            margin-bottom: 8px;
        }
        .trace-panel .trace-label {
            font-weight: 600; color: #818cf8; font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 3px;
        }
        .trace-panel .trace-value {
            color: #c0c0d4; white-space: pre-wrap; word-break: break-all;
        }
        .trace-panel .sop-badge {
            display: inline-block; padding: 1px 6px;
            border-radius: 3px; font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.3px; margin-right: 4px;
        }
        .sop-badge.info     { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .sop-badge.low      { background: rgba(52,211,153,0.15); color: #34d399; }
        .sop-badge.moderate { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .sop-badge.high     { background: rgba(248,113,113,0.15); color: #f87171; }
        .sop-badge.critical { background: rgba(248,113,113,0.25); color: #fca5a5; }

        /* Loading dots */
        .loading { display: flex; gap: 4px; padding: 6px 0; }
        .loading span {
            width: 5px; height: 5px;
            background: #6366f1; border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .loading span:nth-child(2) { animation-delay: 0.15s; }
        .loading span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40%           { transform: scale(1);   opacity: 1;   }
        }

        /* -- Input -- */
        .chat-input {
            padding: 12px 14px 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-field {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #e8e8f0; font-size: 13px;
            font-family: 'Inter', sans-serif;
            resize: none; outline: none;
            min-height: 40px; max-height: 100px;
            transition: border-color 0.2s ease;
        }
        .input-field::placeholder { color: #4a4a62; }
        .input-field:focus {
            border-color: rgba(99,102,241,0.5);
            box-shadow: 0 0 0 2px rgba(99,102,241,0.15);
        }
        .btn-send {
            width: 40px; height: 40px;
            background: #6366f1; border: none;
            border-radius: 10px; color: white;
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .btn-send:hover { background: #818cf8; transform: scale(1.05); }
        .btn-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .btn-send svg { width: 16px; height: 16px; }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 520px) {
            #chat-layer { padding: 8px; }
            .chat-panel { width: 100%; border-radius: 14px; }
            .chat-header { padding: 10px 14px; }
            .chat-title span { display: none; }
        }
    </style>
</head>
<body>
    <!-- STEP 1: Star field background -->
    <div id="stars"></div>

    <!-- STEP 1: Three.js Earth canvas -->
    <canvas id="earth-canvas"></canvas>

    <!-- STEP 3: Weather overlay layer -->
    <div id="weather-overlay">
        <!-- Cloud shapes (used by cloudy + ignored by others) -->
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
        <!-- Rain canvas -->
        <canvas id="rain-canvas"></canvas>
        <!-- Lightning flash -->
        <div id="lightning-flash"></div>
    </div>

    <!-- STEP 2: Chat UI -->
    <div id="chat-layer">
        
        <!-- Hero Title (Left Side) -->
        <div id="hero-title">
            <div class="hero-icon">🌦️</div>
            <h1>Weather Safety<br>Advisor</h1>
            <p>Your intelligent guide to outdoor activities. Real-time weather data matched with expert safety policies.</p>
        </div>

        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-logo">⛅</div>
                    <div class="chat-title">Weather Advisory <span>Bot</span></div>
                </div>
                <button class="btn-new" id="btnNew">✦ New Session</button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🌦️</div>
                    <h2>Weather Safety Advisor</h2>
                    <p>Ask about outdoor activity safety based on live weather. Every answer cites its safety policy.</p>
                    <div class="suggestions">
                        <button class="suggestion" data-q="Is it safe to cycle in Bhopal today?">🚲 Cycling in Bhopal</button>
                        <button class="suggestion" data-q="Can I take my kids to the park in Delhi?">🧒 Park in Delhi</button>
                        <button class="suggestion" data-q="Good day for a picnic in Mumbai?">🧺 Picnic in Mumbai</button>
                        <button class="suggestion" data-q="Is it safe to ride my scooty in Pune?">🛵 Scooty in Pune</button>
                    </div>
                </div>
            </div>

            <div class="chat-input">
                <div class="input-row">
                    <textarea class="input-field" id="inputField"
                        placeholder="Ask about outdoor safety…"
                        rows="1"></textarea>
                    <button class="btn-send" id="btnSend">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================================================================
         SCRIPTS
         ================================================================ -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.186.1/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        /* ==============================================================
           STEP 1 — ROTATING EARTH
           ============================================================== */
        const canvas = document.getElementById('earth-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene  = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.2);          // HOME position

        // Lighting
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x334466, 0.6));

        // Earth sphere (blue fallback first)
        const geo = new THREE.SphereGeometry(1, 64, 64);
        const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x1a5276, roughness: 0.85, metalness: 0.1 });
        const earth = new THREE.Mesh(geo, fallbackMat);
        earth.rotation.x = THREE.MathUtils.degToRad(23.4);
        scene.add(earth);

        // Texture load (with fallback)
        const texLoader = new THREE.TextureLoader();
        texLoader.load(
            'https://unpkg.com/three-globe@2.35.0/example/img/earth-day.jpg',
            (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75, metalness: 0.05 });
                earth.material.dispose();
                earth.material = mat;
            },
            undefined,
            () => console.warn('Earth texture failed — using blue fallback.'),
        );

        // Atmosphere glow
        const atmosGeo = new THREE.SphereGeometry(1.015, 64, 64);
        const atmosMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, transparent: true, opacity: 0.08, side: THREE.BackSide });
        scene.add(new THREE.Mesh(atmosGeo, atmosMat));

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* ==============================================================
           STEP 4 — ZOOM STATE MACHINE
           ============================================================== */
        const HOME_Z  = 3.2;
        const SCENE_Z = 1.9;
        let uiState   = 'HOME';          // HOME | ZOOMING | SCENE
        let zoomTween  = null;            // { from, to, start, duration }

        function startZoom(targetZ, duration = 1500) {
            uiState = 'ZOOMING';
            zoomTween = {
                from: camera.position.z,
                to: targetZ,
                start: performance.now(),
                duration,
            };
        }

        function easeInOut(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001;

            if (zoomTween) {
                const elapsed = performance.now() - zoomTween.start;
                const progress = Math.min(elapsed / zoomTween.duration, 1);
                const eased    = easeInOut(progress);
                camera.position.z = zoomTween.from + (zoomTween.to - zoomTween.from) * eased;
                if (progress >= 1) {
                    uiState = camera.position.z < HOME_Z - 0.1 ? 'SCENE' : 'HOME';
                    zoomTween = null;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        /* ==============================================================
           STEP 3 — RAIN CANVAS (2D overlay)
           ============================================================== */
        const rainCanvas = document.getElementById('rain-canvas');
        const rainCtx    = rainCanvas.getContext('2d');
        let   rainDrops  = [];
        let   rainActive = false;

        function initRain() {
            rainCanvas.width  = window.innerWidth;
            rainCanvas.height = window.innerHeight;
            rainDrops = [];
            for (let i = 0; i < 180; i++) {
                rainDrops.push({
                    x: Math.random() * rainCanvas.width,
                    y: Math.random() * rainCanvas.height,
                    len: 12 + Math.random() * 22,
                    speed: 8 + Math.random() * 10,
                    alpha: 0.15 + Math.random() * 0.25,
                });
            }
        }

        function drawRain() {
            if (!rainActive) return;
            requestAnimationFrame(drawRain);
            rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
            for (const d of rainDrops) {
                rainCtx.beginPath();
                rainCtx.moveTo(d.x, d.y);
                rainCtx.lineTo(d.x + 0.5, d.y + d.len);
                rainCtx.strokeStyle = `rgba(140, 180, 255, ${d.alpha})`;
                rainCtx.lineWidth = 1;
                rainCtx.stroke();
                d.y += d.speed;
                if (d.y > rainCanvas.height) {
                    d.y = -d.len;
                    d.x = Math.random() * rainCanvas.width;
                }
            }
        }

        window.addEventListener('resize', () => {
            if (rainActive) initRain();
        });

        /* ==============================================================
           STEP 3 — SET WEATHER OVERLAY
           ============================================================== */
        const overlay = document.getElementById('weather-overlay');
        let   currentTheme = null;

        function setWeatherOverlay(theme) {
            // Remove all theme classes, stop rain
            overlay.classList.remove('active', 'sunny', 'cloudy', 'rain', 'thunderstorm');
            rainActive = false;

            if (!theme || theme === currentTheme) {
                // If same theme, just keep it — or clear if null
                if (!theme) { currentTheme = null; return; }
            }
            currentTheme = theme;

            // Activate
            overlay.classList.add(theme, 'active');

            // Start rain animation for rain / thunderstorm
            if (theme === 'rain' || theme === 'thunderstorm') {
                rainActive = true;
                initRain();
                drawRain();
            }
        }

        /* ==============================================================
           STEP 4 — WMO CODE → THEME  (verified against Open-Meteo docs)
           https://open-meteo.com/en/docs
           WMO codes:
             0       = Clear sky
             1,2,3   = Mainly clear, partly cloudy, overcast
             45,48   = Fog, depositing rime fog
             51,53,55 = Drizzle (light, moderate, dense)
             56,57   = Freezing drizzle
             61,63,65 = Rain (slight, moderate, heavy)
             66,67   = Freezing rain
             71,73,75 = Snowfall
             77      = Snow grains
             80,81,82 = Rain showers
             85,86   = Snow showers
             95      = Thunderstorm
             96,99   = Thunderstorm with hail
           ============================================================== */
        function themeFromCode(code) {
            if (code === null || code === undefined) return null;
            const c = Number(code);
            if ([95, 96, 99].includes(c))                       return 'thunderstorm';
            if ([61, 63, 65, 66, 67, 80, 81, 82].includes(c))  return 'rain';
            if ([51, 53, 55, 56, 57].includes(c))               return 'rain';      // drizzle → rain
            if ([71, 73, 75, 77, 85, 86].includes(c))           return 'cloudy';     // snow → cloudy (overlay)
            if ([45, 48].includes(c))                            return 'cloudy';     // fog → cloudy
            if ([1, 2, 3].includes(c))                           return 'cloudy';
            if (c === 0)                                         return 'sunny';
            return 'cloudy';   // fallback for unknown codes
        }

        /* ==============================================================
           STEP 4 — SCENE TRANSITIONS
           ============================================================== */
        function transitionToScene(weatherCode) {
            const theme = themeFromCode(weatherCode);
            if (!theme) return;  // no weather data → stay HOME

            if (uiState === 'HOME') {
                startZoom(SCENE_Z, 1500);
            } else if (uiState === 'SCENE') {
                // Small nudge on scene change
                startZoom(SCENE_Z - 0.05, 600);
                setTimeout(() => startZoom(SCENE_Z, 500), 650);
            }

            setWeatherOverlay(theme);
        }

        function returnToHome() {
            setWeatherOverlay(null);
            startZoom(HOME_Z, 1200);
        }

        /* ==============================================================
           STEP 2 — CHAT LOGIC
           ============================================================== */
        let sessionId  = 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
        let isLoading  = false;
        let userLatitude  = null;
        let userLongitude = null;

        // Helper: get location as a promise (with short timeout)
        function getLocation(timeoutMs = 3000) {
            return new Promise((resolve) => {
                if (userLatitude !== null && userLongitude !== null) {
                    resolve({ latitude: userLatitude, longitude: userLongitude });
                    return;
                }
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                const timer = setTimeout(() => resolve(null), timeoutMs);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        clearTimeout(timer);
                        userLatitude  = pos.coords.latitude;
                        userLongitude = pos.coords.longitude;
                        console.log('📍 Location detected:', userLatitude, userLongitude);
                        resolve({ latitude: userLatitude, longitude: userLongitude });
                    },
                    (err) => {
                        clearTimeout(timer);
                        console.log('📍 Location not available:', err.message);
                        resolve(null);
                    },
                    { enableHighAccuracy: false, timeout: timeoutMs, maximumAge: 300000 }
                );
            });
        }

        // Try to get location immediately on load
        getLocation(8000);

        const messages = document.getElementById('chatMessages');
        const input    = document.getElementById('inputField');
        const btnSend  = document.getElementById('btnSend');
        const btnNew   = document.getElementById('btnNew');

        // Auto-resize textarea
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 100) + 'px';
        });

        // Enter = send, Shift+Enter = newline
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        btnSend.addEventListener('click', sendMessage);

        // Suggestion buttons
        document.querySelectorAll('.suggestion').forEach(btn => {
            btn.addEventListener('click', () => {
                input.value = btn.dataset.q;
                sendMessage();
            });
        });

        // New session
        btnNew.addEventListener('click', () => {
            fetch('/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId }),
            }).catch(() => {});
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);

            messages.innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🌦️</div>
                    <h2>Weather Safety Advisor</h2>
                    <p>Ask about outdoor activity safety based on live weather. Every answer cites its safety policy.</p>
                    <div class="suggestions">
                        <button class="suggestion" data-q="Is it safe to cycle in Bhopal today?">🚲 Cycling in Bhopal</button>
                        <button class="suggestion" data-q="Can I take my kids to the park in Delhi?">🧒 Park in Delhi</button>
                        <button class="suggestion" data-q="Good day for a picnic in Mumbai?">🧺 Picnic in Mumbai</button>
                        <button class="suggestion" data-q="Is it safe to ride my scooty in Pune?">🛵 Scooty in Pune</button>
                    </div>
                </div>`;
            messages.querySelectorAll('.suggestion').forEach(btn => {
                btn.addEventListener('click', () => {
                    input.value = btn.dataset.q;
                    sendMessage();
                });
            });

            returnToHome();
        });

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function addUserMsg(text) {
            const w = document.getElementById('welcome');
            if (w) w.remove();

            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `
                <div class="msg-avatar">👤</div>
                <div class="msg-body"><p>${esc(text)}</p></div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addBotMsg(reply, trace) {
            const div = document.createElement('div');
            div.className = 'msg bot';

            // Split reply / citation
            let mainReply = reply, citation = '';
            const parts = reply.split('\n---\n');
            if (parts.length > 1) {
                mainReply = parts[0];
                citation  = parts.slice(1).join('\n');
            }

            const formatted = mainReply
                .split('\n')
                .filter(l => l.trim())
                .map(l => `<p>${esc(l)}</p>`)
                .join('');

            let traceHtml = '';
            if (trace) {
                const tid = 'tr_' + Date.now();

                // Build readable trace
                let traceContent = '';

                // Route
                traceContent += `<div class="trace-section"><div class="trace-label">Route</div><div class="trace-value">${esc((trace.route || []).join(' → '))}</div></div>`;

                // Primary SOP
                if (trace.matched_sops && trace.matched_sops.length > 0) {
                    const primary = trace.matched_sops[0];
                    const severity = primary.severity || '';
                    traceContent += `<div class="trace-section"><div class="trace-label">Primary Policy</div><div class="trace-value"><span class="sop-badge ${severity}">${severity}</span>${esc(primary.id + ' — ' + (primary.title || ''))}</div></div>`;

                    // Weather numbers from conditions
                    if (primary.conditions && primary.conditions.length > 0) {
                        const nums = primary.conditions
                            .map(c => `${c.metric}: ${c.actual} (threshold: ${c.op} ${c.threshold})`)
                            .join('\n');
                        traceContent += `<div class="trace-section"><div class="trace-label">Weather Numbers Used</div><div class="trace-value">${esc(nums)}</div></div>`;
                    }
                }

                // Secondary SOPs
                if (trace.matched_sops && trace.matched_sops.length > 1) {
                    const secs = trace.matched_sops.slice(1)
                        .map(s => `${s.id} — ${s.title || ''} (${s.severity})`)
                        .join('\n');
                    traceContent += `<div class="trace-section"><div class="trace-label">Secondary Policies</div><div class="trace-value">${esc(secs)}</div></div>`;
                }

                // Grounding
                if (trace.grounding_attempts) {
                    traceContent += `<div class="trace-section"><div class="trace-label">Grounding</div><div class="trace-value">Attempts: ${trace.grounding_attempts}</div></div>`;
                }

                traceHtml = `
                    ${citation ? `<div class="citation">${esc(citation)}</div>` : ''}
                    <button class="trace-toggle" onclick="document.getElementById('${tid}').classList.toggle('open')">◈ Why this answer</button>
                    <div class="trace-panel" id="${tid}">${traceContent}</div>`;
            }

            div.innerHTML = `
                <div class="msg-avatar">⛅</div>
                <div class="msg-body">
                    ${formatted}
                    ${traceHtml}
                </div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addErrorMsg(text) {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = `
                <div class="msg-avatar">⛅</div>
                <div class="msg-body error"><p>⚠️ ${esc(text)}</p></div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addLoading() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.id = 'loading-msg';
            div.innerHTML = `
                <div class="msg-avatar">⛅</div>
                <div class="msg-body"><div class="loading"><span></span><span></span><span></span></div></div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text || isLoading) return;

            addUserMsg(text);
            input.value = '';
            input.style.height = 'auto';

            isLoading = true;
            btnSend.disabled = true;
            const loadEl = addLoading();

            try {
                // Get fresh location before sending (waits up to 3s)
                const coords = await getLocation(3000);

                const payload = { session_id: sessionId, message: text };
                if (coords) {
                    payload.latitude  = coords.latitude;
                    payload.longitude = coords.longitude;
                }

                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                loadEl.remove();

                if (!resp.ok) {
                    let errorMsg = `Server error (${resp.status})`;
                    try {
                        const errData = await resp.json();
                        if (errData && errData.detail) errorMsg = errData.detail;
                    } catch (e) {}
                    throw new Error(errorMsg);
                }

                const data = await resp.json();
                addBotMsg(data.reply, data.trace);

                // STEP 4: handle weather overlay transition
                const weatherCode = data.trace?.weather_code;
                if (weatherCode !== null && weatherCode !== undefined) {
                    transitionToScene(weatherCode);
                }
                // If no weather_code (failure/OOS), stay HOME, no overlay

            } catch (err) {
                loadEl.remove();
                addErrorMsg(`Failed to get a response: ${err.message}. Please try again.`);
            } finally {
                isLoading = false;
                btnSend.disabled = false;
                input.focus();
            }
        }

        // Focus input on load
        input.focus();
    </script>
</body>
</html>
